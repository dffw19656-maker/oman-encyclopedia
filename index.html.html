<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فهرس الموسوعة العُمانية الشامل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1f2a24;--mute:#6b7469;--line:#e5ddc9;--pri:#0f5a46;--pri2:#0b3f32;--gold:#b8892d;--chip:#efe8d6;--tag:#e3efe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1a2420;--ink:#ece8dc;--mute:#9aa596;--line:#2c3a33;--pri:#5fbf9f;--pri2:#0c2b22;--gold:#e0b255;--chip:#25332c;--tag:#21352c}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a2420;--ink:#ece8dc;--mute:#9aa596;--line:#2c3a33;--pri:#5fbf9f;--pri2:#0c2b22;--gold:#e0b255;--chip:#25332c;--tag:#21352c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,'Segoe UI',sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#0b3f32,#0f5a46 60%,#17785d);color:#fff;padding:34px 18px 54px;text-align:center;position:relative}
header h1{font-family:'Amiri',serif;font-size:clamp(28px,5vw,46px);margin:0 0 6px}
header p{margin:0;opacity:.85;font-size:15px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:6px 18px}
.stat b{display:block;font-size:22px;color:#f1d58a}.stat span{font-size:12px;opacity:.85}
#theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
main{max-width:980px;margin:-30px auto 40px;padding:0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.07)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-radius:16px}
#q{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:0}
#q:focus{border-color:var(--pri)}
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.row label{font-size:13px;color:var(--mute);align-self:center;white-space:nowrap;padding-inline-end:4px}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.info{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);padding:12px 4px 4px;gap:8px;flex-wrap:wrap}
.reset{font:inherit;font-size:13px;background:none;border:0;color:var(--pri);cursor:pointer;text-decoration:underline}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:16px 0}
.vc{text-align:right;font:inherit;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.vc:hover{border-color:var(--pri)}.vc b{color:var(--pri);font-size:16px}.vc small{display:block;color:var(--mute);font-size:12.5px}
.letter{font-family:'Amiri',serif;font-size:26px;color:var(--gold);margin:22px 4px 6px;border-bottom:2px solid var(--line)}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border-bottom:1px solid var(--line);background:var(--card)}
.it:hover{background:var(--chip)}
.n{width:42px;flex:none;color:var(--mute);font-size:12px;text-align:center}
.t{flex:1;font-size:17px;font-weight:500}
.tag{font-size:12px;background:var(--tag);color:var(--pri);border-radius:8px;padding:0 9px;margin-inline-start:8px;white-space:nowrap}
.vb{font-size:12px;color:var(--mute);white-space:nowrap}
.pg{flex:none;min-width:64px;text-align:center;background:var(--pri2);color:#f1d58a;border-radius:8px;font-size:13px;padding:1px 8px}
.more,.empty{display:block;margin:18px auto;font:inherit;font-size:15px;padding:10px 28px;border-radius:12px;border:1px solid var(--pri);background:var(--card);color:var(--pri);cursor:pointer}
.empty{border:0;color:var(--mute);cursor:default;text-align:center}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 14px 30px}
@media (max-width:560px){.vb{display:none}.t{font-size:16px}.n{width:34px}}
@media print{header,.bar,.vols,.more,#theme{display:none}.it{break-inside:avoid}}
</style>
</head>
<body>
<header>
<button id="theme" aria-label="تبديل المظهر">◐</button>
<h1>فهرس الموسوعة العُمانية</h1>
<p>الفهرس الشامل والمرتب للمجلدات من الأول إلى العاشر</p>
<div class="stats"><div class="stat"><b id="sN">0</b><span>مدخل</span></div><div class="stat"><b>١٠</b><span>مجلدات</span></div><div class="stat"><b id="sC">0</b><span>تصنيف</span></div></div>
</header>
<main>
<div class="panel bar">
<input id="q" type="search" placeholder="ابحث عن مدخل: اسم، مكان، نبات، سمكة…" autocomplete="off">
<div class="row" id="rv"></div>
<div class="row" id="rl"></div>
<div class="row" id="rt"></div>
<div class="info"><span id="cnt"></span><button class="reset" id="rs">مسح الفلاتر</button></div>
</div>
<div class="vols" id="vols"></div>
<div id="list"></div>
</main>
<footer>الأرقام تدل على رقم المجلد والصفحة كما وردت في الفهرس الأصلي</footer>
